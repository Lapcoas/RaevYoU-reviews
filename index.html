<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RaevYoU — отзывы</title>
  <meta name="description" content="Отзывы о продавце RaevYoU. Прочитайте отзывы покупателей или оставьте свой.">
  <meta name="theme-color" content="#000000">
  <meta property="og:title" content="RaevYoU — отзывы">
  <meta property="og:description" content="Отзывы о продавце RaevYoU. Прочитайте отзывы покупателей или оставьте свой.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23000'/%3E%3Cpath fill='%23fff' d='M12 4.6l2.2 4.6 5 .7-3.6 3.5.9 5-4.5-2.4-4.5 2.4.9-5L4.8 9.9l5-.7z'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="tools"><button id="themeBtn" type="button" aria-label="Сменить тему">🎨</button><button id="soundBtn" type="button" aria-label="Звук">🔔</button></div>

  <!-- ===== Первый экран ===== -->
  <header class="hero">
    <div class="hero__inner" id="heroInner">
      <div class="brand">
        <h1 class="brand__name shine">RaevYoU</h1>
        <p class="brand__sub shine">отзывы</p>
      </div>
      <div class="hero__links"><button id="aboutBtn" type="button">О продавце</button><a id="contactBtn" href="#" hidden>Связаться</a></div>
    </div>
    <a class="hero__cue" href="#reviews" aria-label="Перейти к отзывам"><span></span></a>
  </header>

  <!-- ===== Отзывы ===== -->
  <main class="reviews" id="reviews">
    <div class="summary" id="summary" hidden>
      <div class="summary__main">
        <span class="summary__avg" id="sumAvg"></span>
        <div class="summary__meta">
          <span class="rating" id="sumStars" role="img"></span>
          <span class="summary__count" id="sumCount"></span>
        </div>
      </div>
      <div class="bars" id="sumBars"></div>
    </div>

    <div class="finder" id="toolbar" hidden>
    <input class="search" id="search" type="search" placeholder="Поиск по отзывам" autocomplete="off">
    <div class="toolbar">
      <button class="tchip is-on" type="button" data-sort="new">Новые</button>
      <button class="tchip" type="button" data-sort="best">Лучшие</button>
      <button class="tchip" type="button" data-sort="helpful">Полезные</button>
      <button class="tchip" type="button" data-sort="photo">С фото</button>
      <button class="tchip" type="button" data-sort="text">С текстом</button>
      <button class="tchip" type="button" data-sort="reply">С ответом продавца</button>
    </div>
    </div>

    <div class="grid" id="grid" aria-live="polite"></div>
    <p class="noresults" id="noresults" hidden>Ничего не найдено</p>

    <div class="empty" id="empty" hidden>
      <p class="empty__title">Пока нет ни одного отзыва</p>
      <p class="empty__text">Станьте первым — нажмите кнопку внизу.</p>
    </div>

    <div class="empty" id="error" hidden>
      <p class="empty__title">Не удалось загрузить отзывы</p>
      <p class="empty__text">Проверьте интернет и попробуйте ещё раз.</p>
      <button class="ghost" id="retry" type="button">Повторить</button>
    </div>

    <div id="sentinel" aria-hidden="true"></div>
  </main>

  <!-- ===== Плавающая кнопка ===== -->
  <button class="fab" id="fab" type="button" data-mode="new">
    <svg class="fab__icon fab__icon--plus" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    <svg class="fab__icon fab__icon--pencil" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 2.8 0l.2.2a2 2 0 0 1 0 2.8L8 19l-4 1z"/><path d="M14.5 6.5l3 3"/></svg>
    <span id="fabText">Написать свой отзыв</span>
  </button>

  <!-- ===== Окно отзыва ===== -->
  <div class="modal" id="modal" aria-hidden="true" inert>
    <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">

      <button class="round round--close" id="close" type="button" aria-label="Закрыть">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>

      <div class="modal__body">
        <h2 class="modal__title" id="modalTitle">Новый отзыв</h2>
        <p class="modal__lead" id="modalLead">Придумайте любой никнейм и поставьте оценку.</p>

        <div class="field">
          <label class="label" for="nick">Никнейм</label>
          <input class="input" id="nick" type="text" maxlength="24" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Например, Georgiu">
          <label class="anon"><input type="checkbox" id="anon"><span class="anon__box"></span><span>Оставить анонимно</span></label>
        </div>

        <div class="field">
          <label class="label" for="product">Что купили (необязательно)</label>
          <input class="input" id="product" type="text" maxlength="40" autocomplete="off" placeholder="Например, аккаунт, услуга, товар">
        </div>

        <div class="field">
          <span class="label" id="ratingLabel">Оценка</span>
          <div class="stars" id="stars" role="radiogroup" aria-labelledby="ratingLabel">
            <button class="star" type="button" role="radio" aria-checked="false" aria-label="1 из 5" data-v="1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.2 1.2-6.5L2.5 9.5l6.6-.9z"/></svg></button>
            <button class="star" type="button" role="radio" aria-checked="false" aria-label="2 из 5" data-v="2"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.2 1.2-6.5L2.5 9.5l6.6-.9z"/></svg></button>
            <button class="star" type="button" role="radio" aria-checked="false" aria-label="3 из 5" data-v="3"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.2 1.2-6.5L2.5 9.5l6.6-.9z"/></svg></button>
            <button class="star" type="button" role="radio" aria-checked="false" aria-label="4 из 5" data-v="4"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.2 1.2-6.5L2.5 9.5l6.6-.9z"/></svg></button>
            <button class="star" type="button" role="radio" aria-checked="false" aria-label="5 из 5" data-v="5"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.2 1.2-6.5L2.5 9.5l6.6-.9z"/></svg></button>
          </div>
          <p class="hint" id="hint" aria-live="polite"></p>
        </div>

        <div class="field">
          <div class="label-row">
            <label class="label" for="text">Отзыв</label>
            <span class="counter" id="counter">0 / 500</span>
          </div>
          <textarea class="textarea" id="text" maxlength="500" rows="4" placeholder="Опишите работу продавца (необязательно)"></textarea>
          <div class="qtags"><button type="button" class="qtag" data-t="Быстро">⚡ Быстро</button><button type="button" class="qtag" data-t="Вежливо">🤝 Вежливо</button><button type="button" class="qtag" data-t="Всё как описано">✅ Всё как описано</button><button type="button" class="qtag" data-t="Отличное качество">💎 Качество</button><button type="button" class="qtag" data-t="Всегда на связи">💬 На связи</button></div>
        </div>

        <div class="field" id="photoField">
          <span class="label">Фото (необязательно)</span>
          <label class="photo-pick" id="photoPick"><input type="file" id="photo" accept="image/*" hidden><span>＋ Добавить фото</span></label>
          <div class="photo-prev" id="photoPrev" hidden><img id="photoImg" alt=""><button type="button" id="photoDel" aria-label="Убрать фото">✕</button></div>
        </div>
      </div>

      <div class="modal__footer">
        <button class="round round--back" id="back" type="button" aria-label="Назад на сайт">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6l-6 6 6 6"/></svg>
        </button>
        <button class="submit" id="submit" type="button" tabindex="-1" aria-hidden="true">
          <span id="submitText">Оставить отзыв</span>
        </button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript><p style="position:fixed;inset:auto 16px 16px;text-align:center;color:#fff">Для работы сайта нужен JavaScript.</p></noscript>
  <script src="script.js"></script>
</body>
</html>
